<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系列详情 | 鼎烽机电商行</title>
<meta name="description" content="上海人民 SRM 水泵系列详情：适用场景、选型要点、子系列与完整参数表。佛山南海鼎烽机电商行·广佛总代理 13690528818。">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/product.css">
<style>
.hero2{display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:center}
.gal{display:grid;gap:10px}
.gal .big{background:linear-gradient(160deg,#EEF3F7,#DAE4EC);border-radius:14px;height:300px;
  position:relative;overflow:hidden;display:grid;place-items:center}
.gal .big img{position:absolute;inset:22px;width:calc(100% - 44px);height:calc(100% - 44px);
  object-fit:contain;filter:drop-shadow(0 14px 26px rgba(20,45,70,.25))}
.gal .big .none{color:var(--ink-3);font-size:13px;font-family:var(--mono);text-align:center;
  line-height:1.9;padding:0 28px}
.gal .thumbs{display:flex;gap:8px;flex-wrap:wrap}
.gal .thumbs button{width:62px;height:62px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);padding:5px;cursor:pointer;position:relative;overflow:hidden}
.gal .thumbs button[aria-current="true"]{border-color:var(--blue-ink);box-shadow:0 0 0 2px var(--blue-wash)}
.gal .thumbs img{width:100%;height:100%;object-fit:contain}
.uses{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-top:6px}
.use{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;color:var(--ink-2);
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.use b{color:var(--blue-ink);font-family:var(--mono);font-size:11px;line-height:1.9;flex-shrink:0}
.pickbox{background:var(--blue-wash);border:1px solid #C4D8EC;border-left:3px solid var(--blue-ink);
  border-radius:10px;padding:15px 18px;margin-top:18px;font-size:14.5px;color:var(--ink)}
.pickbox b{color:var(--blue-ink)}
@media (max-width:900px){.hero2{grid-template-columns:1fr;gap:22px}.gal .big{height:230px}}
</style>
</head>
<body class="page">

<header class="phead">
  <div class="wrap">
    <div class="crumb"><a href="../index.html">首页</a><i>/</i><a href="pumps.html">水泵</a><i>/</i><span id="cbName">系列</span></div>
    <h1 id="hName">—</h1>
    <div class="ptag" id="hTags"></div>
    <div class="pstats" id="hStats"></div>
  </div>
</header>

<div class="wrap">
  <section class="sect">
    <div class="hero2">
      <div>
        <div class="rule"></div>
        <h2 style="font-size:22px;font-weight:600;margin-bottom:10px">这一类泵用在哪</h2>
        <p class="prose" id="lead" style="margin:0 0 16px"></p>
        <div class="uses" id="uses"></div>
        <div class="pickbox" id="pick"></div>
      </div>
      <div class="gal">
        <div class="big" id="galBig"></div>
        <div class="thumbs" id="galThumbs"></div>
      </div>
    </div>
  </section>

  <section class="sect" style="padding-top:0">
    <div class="sec-h">
      <div><div class="rule"></div><h2>子系列与参数表</h2>
        <div class="sub" id="subHint">点开看完整型号参数 · 参数照上海人民样本录入</div></div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn btn-g" id="openAll">全部展开</button>
        <a class="btn btn-g" href="pumps.html" id="filterLink">在这个系列里选型 →</a>
      </div>
    </div>
    <div class="subs" id="subs"></div>
  </section>

  <div class="cta">
    <div class="t"><h3>要哪个型号，直接报给我们</h3>
      <p>表里点「复制型号并询价」会把整行参数复制好，粘给我们就行。不确定选哪个也可以直接说工况。</p></div>
    <div class="acts">
      <a class="tel btn btn-p" href="tel:13690528818">13690528818</a>
      <a class="btn btn-s" href="#" data-wechat>扫码加微信</a>
    </div>
  </div>

  <section class="sect" style="padding-top:0">
    <div class="sec-h"><div><div class="rule"></div><h2>其他系列</h2></div></div>
    <div class="sgrid" id="others"></div>
  </section>
</div>

<script src="../data/catalog.js"></script>
<script src="../data/series-copy.js"></script>
<script src="../assets/js/site.js"></script>
<script src="../assets/js/finder.js"></script>
<script src="../assets/js/page-products-series.js"></script>
</body>
</html>
